<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRü — Presave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-hot: #FF69B4;
    --pink-mid: #FF8DC7;
    --pink-soft: #FFB6D9;
    --pink-pale: #FFD6E8;
    --blue-bubblegum: #7EB6FF;
    --blue-soft: #B8D4FF;
    --blue-pale: #D6E8FF;
    --lilac: #C9A0DC;
    --lilac-soft: #E0C6F0;
    --lilac-pale: #EFE0F7;
    --text-dark: #2A1A30;
    --text-mid: #5A4060;
    --text-light: #8A7090;
    --bg: #FFF5FA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === BACKGROUND === */
  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 85%, rgba(255,105,180,0.12) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 85% 15%, rgba(126,182,255,0.14) 0%, transparent 55%),
      radial-gradient(ellipse 60% 60% at 50% 50%, rgba(201,160,220,0.08) 0%, transparent 55%),
      linear-gradient(160deg, #FFF5FA 0%, #FFF0F5 30%, #F5F0FF 60%, #F0F5FF 100%);
    animation: gradShift 10s ease-in-out infinite alternate;
  }
  @keyframes gradShift { 0%{filter:hue-rotate(0deg) brightness(1)} 100%{filter:hue-rotate(5deg) brightness(1.01)} }

  /* === GLITTER === */
  .glitter-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .glitter {
    position: absolute; border-radius: 50%;
    animation: sparkle var(--dur) var(--delay) infinite ease-in-out; opacity: 0;
  }
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:0.8;transform:scale(1.3)} }

  /* === CONTAINER === */
  .container {
    position: relative; z-index: 10; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  /* === LOGO === */
  .logo-wrap { margin-bottom: 8px; animation: logoIn 1s ease-out 0.2s both; position: relative; z-index: 3; display: flex; justify-content: center; }
  .logo-wrap img {
    width: 130px; height: 130px; object-fit: contain;
    filter: drop-shadow(0 4px 20px rgba(255,105,180,0.25)) drop-shadow(0 0 40px rgba(126,182,255,0.15));
    transition: transform 0.4s ease, filter 0.4s ease;
  }
  .logo-wrap img:hover {
    transform: scale(1.06) rotate(-2deg);
    filter: drop-shadow(0 4px 25px rgba(255,105,180,0.35)) drop-shadow(0 0 50px rgba(126,182,255,0.25));
  }
  @keyframes logoIn { from{opacity:0;transform:translateY(30px) scale(0.8)} to{opacity:1;transform:translateY(0) scale(1)} }

  /* === ARTIST NAME === */
  .artist-name {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--pink-hot), var(--lilac), var(--blue-bubblegum), var(--pink-mid));
    background-size: 300% 300%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: nameIn 1s ease-out 0.4s both, shimmer 4s ease-in-out infinite;
    text-align: center; line-height: 1; margin-bottom: 8px;
    position: relative; z-index: 3;
  }
  @keyframes nameIn { from{opacity:0;transform:translateY(20px)} to{opacity:1} }
  @keyframes shimmer { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .tagline {
    font-size: clamp(0.9rem, 2.5vw, 1.1rem); font-weight: 300;
    color: var(--text-light); letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 12px; animation: fadeUp 0.8s ease-out 0.7s both; text-align: center;
    position: relative; z-index: 3;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }

  /* === BUBBLE CARD === */
  .bubble-card-wrap {
    position: relative; max-width: 480px; width: 100%;
    animation: cardIn 0.8s ease-out 0.9s both;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(30px) scale(0.96)} to{opacity:1;transform:translateY(0) scale(1)} }

  .bubble-cluster {
    position: absolute; inset: -25px; z-index: 0; pointer-events: none; overflow: visible;
  }

  .cluster-bubble {
    position: absolute; border-radius: 50%;
    border: none;
    animation: bubblePulse var(--dur) var(--delay) infinite ease-in-out;
  }
  .cluster-bubble::before {
    content: ''; position: absolute;
    width: 35%; height: 20%; top: 12%; left: 18%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.35), transparent);
    transform: rotate(-25deg);
  }
  @keyframes bubblePulse {
    0%,100%{transform:scale(1) translate(0,0)}
    33%{transform:scale(1.015) translate(var(--dx),var(--dy))}
    66%{transform:scale(0.985) translate(calc(var(--dx)*-0.5),calc(var(--dy)*-0.5))}
  }

  .card-content {
    position: relative; z-index: 2; padding: 48px 40px; text-align: center;
  }

  .card-title {
    font-family: 'Dela Gothic One', sans-serif; font-size: 1.3rem; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--pink-hot), var(--text-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .card-subtitle {
    font-size: 0.9rem; font-weight: 300; color: var(--text-mid);
    margin-bottom: 28px; line-height: 1.6;
  }
  .song-title { color: var(--lilac); font-weight: 600; }

  /* === INPUT === */
  .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  .email-input {
    width: 100%; padding: 16px 20px; border-radius: 50px;
    border: 2px solid var(--pink-pale);
    background: rgba(255,255,255,0.8);
    color: var(--text-dark); font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 300;
    outline: none; transition: all 0.3s ease; letter-spacing: 0.02em;
  }
  .email-input::placeholder { color: var(--text-light); }
  .email-input:focus {
    border-color: var(--pink-hot);
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 20px rgba(255,105,180,0.15);
  }

  /* === BUTTON === */
  .presave-btn {
    width: 100%; padding: 16px 24px; border: none; border-radius: 50px;
    font-family: 'Dela Gothic One', sans-serif; font-size: 1rem; letter-spacing: 0.06em;
    cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--pink-hot), var(--lilac), var(--blue-bubblegum));
    background-size: 200% 200%; color: #fff; transition: all 0.4s ease;
    animation: btnGrad 3s ease-in-out infinite;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  @keyframes btnGrad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .presave-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,105,180,0.3), 0 0 50px rgba(126,182,255,0.12);
  }
  .presave-btn:active { transform: translateY(0); }
  .presave-btn::after {
    content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg); animation: btnShim 3s infinite 1.5s;
  }
  @keyframes btnShim { 0%{left:-60%} 30%{left:120%} 100%{left:120%} }

  .success-msg {
    display: none; padding: 16px; border-radius: 20px;
    background: rgba(126,182,255,0.15); border: 1px solid rgba(126,182,255,0.25);
    color: #4A7AB5; font-weight: 400; font-size: 0.95rem; line-height: 1.5;
    animation: fadeUp 0.5s ease-out;
  }
  .success-msg.show { display: block; }

  /* === DIVIDER === */
  .divider {
    display: flex; align-items: center; gap: 16px; margin: 24px 0;
    color: var(--text-light); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink-pale), transparent);
  }

  /* === PATREON === */
  .patreon-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 13px 28px;
    border-radius: 50px; border: 2px solid var(--pink-pale);
    background: rgba(255,255,255,0.6);
    color: var(--text-mid);
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 400;
    text-decoration: none; transition: all 0.3s ease;
  }
  .patreon-btn:hover {
    border-color: var(--pink-soft); background: rgba(255,255,255,0.9);
    color: var(--text-dark); transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(255,105,180,0.12);
  }
  .patreon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* === SOCIALS === */
  .socials { display: flex; gap: 16px; margin-top: 40px; animation: fadeUp 0.8s ease-out 1.2s both; }
  .social-link {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--pink-pale);
    background: rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-light); text-decoration: none; transition: all 0.3s ease;
  }
  .social-link:hover {
    border-color: var(--pink-soft); background: rgba(255,255,255,0.9);
    color: var(--pink-hot); transform: translateY(-3px) scale(1.05);
    box-shadow: 0 4px 15px rgba(255,105,180,0.15);
  }
  .social-link svg { width: 20px; height: 20px; fill: currentColor; }

  /* === FOOTER === */
  .footer { margin-top: 44px; animation: fadeUp 0.8s ease-out 1.4s both; text-align: center; }
  .footer p { font-size: 0.7rem; color: var(--text-light); letter-spacing: 0.1em; }
  .footer a { color: var(--text-light); text-decoration: none; transition: color 0.3s; }
  .footer a:hover { color: var(--pink-hot); }

  /* === AMBIENT BUBBLES === */
  .ambient-bubble {
    position: fixed; border-radius: 50%;
    border: none;
    animation: ambFloat var(--dur) var(--delay) infinite ease-in-out;
    z-index: 1; pointer-events: none;
  }
  @keyframes ambFloat {
    0%{transform:translateY(100vh) scale(0.6);opacity:0}
    10%{opacity:0.6} 90%{opacity:0.6}
    100%{transform:translateY(-15vh) scale(1);opacity:0}
  }

  @media (max-width: 520px) {
    .card-content { padding: 36px 22px; }
    .logo-wrap img { width: 105px; height: 105px; }
    .container { padding: 32px 14px; }
    .bubble-cluster { inset: -15px; }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="glitter-container" id="glitterContainer"></div>
<div id="ambientContainer"></div>

<div class="container">

  <div class="bubble-card-wrap">
    <div class="bubble-cluster" id="bubbleCluster"></div>
    <div class="logo-wrap">
      <img src="https://i.postimg.cc/zDw79GJ3/Dru-U.png" alt="DRü" />
    </div>
    <h1 class="artist-name">DRÜ</h1>
    <p class="tagline">Something new is coming</p>
    <div class="card-content">
      <h2 class="card-title">Be the first to hear it</h2>
      <p class="card-subtitle">
        Drop your email to presave <span class="song-title">"Trucks Broke Down"</span><br>
        and get early access to everything.
      </p>

      <div class="input-group" id="formGroup">
        <input type="email" class="email-input" id="emailInput" placeholder="your email" autocomplete="email" />
        <button class="presave-btn" id="presaveBtn" onclick="handlePresave()">PRESAVE NOW ✦</button>
      </div>

      <div class="success-msg" id="successMsg">
        ✦ you're in, babe. we'll hit you up when it drops. 💖
      </div>

      <div class="divider">or</div>

      <a href="#" class="patreon-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14.82 2.41c3.96 0 7.18 3.24 7.18 7.21 0 3.96-3.22 7.18-7.18 7.18-3.97 0-7.21-3.22-7.21-7.18 0-3.97 3.24-7.21 7.21-7.21M2 21.6h3.5V2.41H2V21.6z"/></svg>
        Get the song today on Patreon
      </a>
    </div>
  </div>

  <div class="socials">
    <a href="#" class="social-link" title="TikTok" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.34-6.34V8.73a8.19 8.19 0 004.76 1.52V6.8a4.84 4.84 0 01-1-.11z"/></svg>
    </a>
    <a href="#" class="social-link" title="Instagram" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85 0 3.2-.01 3.58-.07 4.85-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07-3.2 0-3.58-.01-4.85-.07-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85 0-3.2.01-3.58.07-4.85C2.38 3.86 3.9 2.31 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.7.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98 1.28.06 1.69.07 4.95.07s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95C23.73 2.7 21.3.27 16.95.07 15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1018.16 12 6.16 6.16 0 0012 5.84zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.85a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"/></svg>
    </a>
    <a href="#" class="social-link" title="YouTube" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.546 12 3.546 12 3.546s-7.505 0-9.377.504A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.504 9.376.504 9.376.504s7.505 0 9.377-.504a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
    </a>
  </div>

  <div class="footer">
    <p>© 2026 DRü · Built by <a href="#">Arias Studio</a></p>
  </div>
</div>

<script>
  // === BUBBLE CLUSTER ===
  const cluster = document.getElementById('bubbleCluster');

  const foundation = [
    {x:0.18,y:0.14,r:130},{x:0.82,y:0.14,r:125},{x:0.50,y:0.10,r:145},
    {x:0.13,y:0.50,r:138},{x:0.87,y:0.50,r:132},{x:0.50,y:0.50,r:160},
    {x:0.18,y:0.86,r:130},{x:0.82,y:0.86,r:128},{x:0.50,y:0.92,r:142},
    {x:0.35,y:0.30,r:122},{x:0.65,y:0.30,r:120},{x:0.35,y:0.70,r:124},{x:0.65,y:0.70,r:122},
  ];
  const fillers = [
    {x:0.03,y:0.32,r:72},{x:0.97,y:0.32,r:68},{x:0.03,y:0.68,r:70},{x:0.97,y:0.68,r:74},
    {x:0.28,y:0.01,r:62},{x:0.72,y:0.01,r:60},{x:0.28,y:0.99,r:64},{x:0.72,y:0.99,r:58},
    {x:0.50,y:0.01,r:52},{x:0.50,y:0.99,r:54},{x:0.01,y:0.50,r:58},{x:0.99,y:0.50,r:52},
  ];
  const accents = [];
  for (let i = 0; i < 22; i++) {
    const a = (i/22)*Math.PI*2;
    accents.push({x:0.5+Math.cos(a)*(0.47+Math.random()*0.1), y:0.5+Math.sin(a)*(0.47+Math.random()*0.1), r:Math.random()*28+18});
  }
  const sparkles = [];
  for (let i = 0; i < 14; i++) {
    sparkles.push({x:0.08+Math.random()*0.84, y:0.08+Math.random()*0.84, r:Math.random()*14+7});
  }

  const allB = [...foundation,...fillers,...accents,...sparkles];

  // Light theme matte bubble colors — single uniform color
  const bubbleColor = '#FFD6E8';

  allB.forEach(b => {
    const el = document.createElement('div');
    el.className = 'cluster-bubble';
    const s = b.r*2;
    el.style.width = s+'px'; el.style.height = s+'px';
    el.style.left = `calc(${b.x*100}% - ${b.r}px)`;
    el.style.top = `calc(${b.y*100}% - ${b.r}px)`;
    el.style.background = bubbleColor;
    el.style.setProperty('--dur',(3+Math.random()*4)+'s');
    el.style.setProperty('--delay',(Math.random()*3)+'s');
    el.style.setProperty('--dx',(Math.random()*3-1.5)+'px');
    el.style.setProperty('--dy',(Math.random()*3-1.5)+'px');
    cluster.appendChild(el);
  });

  // === GLITTER ===
  const gc = document.getElementById('glitterContainer');
  const gcols = ['#FF69B4','#FF8DC7','#7EB6FF','#C9A0DC','#FFB6D9','#B8D4FF','#E0C6F0'];
  for (let i=0;i<55;i++){
    const g=document.createElement('div'); g.className='glitter';
    g.style.left=Math.random()*100+'%'; g.style.top=Math.random()*100+'%';
    const sz=Math.random()*3+1.5; g.style.width=g.style.height=sz+'px';
    g.style.background=gcols[Math.floor(Math.random()*gcols.length)];
    g.style.setProperty('--dur',(Math.random()*3+2)+'s');
    g.style.setProperty('--delay',(Math.random()*5)+'s');
    g.style.boxShadow=`0 0 ${Math.random()*6+3}px currentColor`;
    gc.appendChild(g);
  }

  // === AMBIENT ===
  const ac = document.getElementById('ambientContainer');
  const ambCols = ['#FFD6E8','#D6E8FF','#E0C6F0','#FFE0EE','#C8DEFF'];
  for(let i=0;i<6;i++){
    const b=document.createElement('div'); b.className='ambient-bubble';
    const sz=Math.random()*60+25; b.style.width=b.style.height=sz+'px';
    b.style.left=Math.random()*100+'%';
    b.style.background=ambCols[Math.floor(Math.random()*ambCols.length)];
    b.style.setProperty('--dur',(Math.random()*14+10)+'s');
    b.style.setProperty('--delay',(Math.random()*8)+'s');
    ac.appendChild(b);
  }

  // === PRESAVE ===
  function handlePresave(){
    const email=document.getElementById('emailInput').value.trim();
    if(!email||!email.includes('@')||!email.includes('.')){
      const inp=document.getElementById('emailInput');
      inp.style.borderColor='#FF69B4';
      inp.style.animation='none'; inp.offsetHeight;
      inp.style.animation='shake 0.4s ease'; return;
    }
    const btn=document.getElementById('presaveBtn');
    btn.textContent='✦ ✦ ✦'; btn.style.pointerEvents='none';
    setTimeout(()=>{
      document.getElementById('formGroup').style.display='none';
      document.getElementById('successMsg').classList.add('show');
    },600);
  }
  document.getElementById('emailInput').addEventListener('keydown',e=>{if(e.key==='Enter')handlePresave()});

  const ss=document.createElement('style');
  ss.textContent=`@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}`;
  document.head.appendChild(ss);
</script>
</body>
</html>
